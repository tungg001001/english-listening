          blankSentence: 'Is there free Wi-Fi ___ in the room?',
          correctAnswer: 'available',
          hint: '可使用的/現有的'
        },
        {
          id: 10,
          audioText: 'Thank you for your assistance with this project.',
          blankSentence: 'Thank you for your ___ with this project.',
          correctAnswer: 'assistance',
          hint: '協助/幫助'
        }
      ];

      function App() {
        const [activeTab, setActiveTab] = useState('dialogues'); // 'dialogues' | 'speaking' | 'rules' | 'dictation'
        const [selectedDialogueIndex, setSelectedDialogueIndex] = useState(0);
        const [playbackRate, setPlaybackRate] = useState(1.0);
        const [activeLineIdx, setActiveLineIdx] = useState(null);

        // Recording & Speech Recognition States
        const [isRecording, setIsRecording] = useState(false);
        const [recordedAudioUrl, setRecordedAudioUrl] = useState(null);
        const [recognizedText, setRecognizedText] = useState('');
        const [speakingScore, setSpeakingScore] = useState(null);

        const mediaRecorderRef = useRef(null);
        const audioChunksRef = useRef([]);
        const recognitionRef = useRef(null);

        // Dictation Quiz States
        const [userInputs, setUserInputs] = useState({});
        const [quizResults, setQuizResults] = useState({});

        const currentDialogue = DIALOGUES_DATA[selectedDialogueIndex];

        // Calculate Levenshtein-style accuracy percentage
        const calculateAccuracy = (target, actual) => {
          if (!actual) return 0;
          const cleanTarget = target.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim().split(' ');
          const cleanActual = actual.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim().split(' ');

          let matches = 0;
          cleanTarget.forEach((word) => {
            if (cleanActual.includes(word)) matches++;
          });

          return Math.round((matches / cleanTarget.length) * 100);
        };

        // Start/Stop Recording with Web Speech Recognition
        const toggleRecording = async (targetText) => {
          if (isRecording) {
            if (mediaRecorderRef.current) mediaRecorderRef.current.stop();
            if (recognitionRef.current) recognitionRef.current.stop();
            setIsRecording(false);
          } else {
            setRecognizedText('');
            setSpeakingScore(null);
            setRecordedAudioUrl(null);

            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              mediaRecorderRef.current = new MediaRecorder(stream);
              audioChunksRef.current = [];

              mediaRecorderRef.current.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunksRef.current.push(event.data);
              };

              mediaRecorderRef.current.onstop = () => {
                const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/wav' });
                const audioUrl = URL.createObjectURL(audioBlob);
                setRecordedAudioUrl(audioUrl);
              };

              mediaRecorderRef.current.start();

              // Initialize SpeechRecognition if supported
              const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
              if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                  const transcript = event.results[0][0].transcript;
                  setRecognizedText(transcript);
                  if (targetText) {
                    const score = calculateAccuracy(targetText, transcript);
                    setSpeakingScore(score);
                  }
                };

                recognitionRef.current = recognition;
                recognition.start();
              }

              setIsRecording(true);
            } catch (err) {
              alert('無法啟用麥克風，請確認瀏覽器已允許麥克風存取權限。');
            }
          }
        };

        const handleDictationCheck = (qId, answer) => {
          const userVal = (userInputs[qId] || '').trim().toLowerCase();
          const correctVal = answer.toLowerCase();
          setQuizResults({
            ...quizResults,
            [qId]: userVal === correctVal
          });
        };

        return (
          <div className="flex-1 flex flex-col min-h-screen">
            {/* Header */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('dialogues')}>
                  <div className="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-indigo-200">
                    L
                  </div>
                  <div>
                    <h1 className="font-extrabold text-slate-900 text-lg sm:text-xl leading-none">ListeningMaster</h1>
                    <span className="text-[10px] font-extrabold text-indigo-600 tracking-wider uppercase mt-1 block">英文聽講大師</span>
                  </div>
                </div>

                <nav className="flex items-center space-x-1 sm:space-x-2 bg-slate-100 p-1.5 rounded-2xl text-xs sm:text-sm font-bold">
                  <button
                    onClick={() => setActiveTab('dialogues')}
                    className={`px-3.5 py-2 rounded-xl transition-all flex items-center space-x-1.5 ${
                      activeTab === 'dialogues' ? 'bg-white text-indigo-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="headphones" className="w-4 h-4" />
                    <span>情境聽力與跟讀</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('speaking')}
                    className={`px-3.5 py-2 rounded-xl transition-all flex items-center space-x-1.5 ${
                      activeTab === 'speaking' ? 'bg-white text-indigo-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="mic" className="w-4 h-4" />
                    <span>口說萬用句型特訓</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('rules')}
                    className={`px-3.5 py-2 rounded-xl transition-all flex items-center space-x-1.5 ${
                      activeTab === 'rules' ? 'bg-white text-indigo-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="zap" className="w-4 h-4" />
                    <span>連音與發音變音規律</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('dictation')}
                    className={`px-3.5 py-2 rounded-xl transition-all flex items-center space-x-1.5 ${
                      activeTab === 'dictation' ? 'bg-white text-indigo-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="edit-3" className="w-4 h-4" />
                    <span>聽音聽寫填空測驗</span>
                  </button>
                </nav>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-10">
              {activeTab === 'dialogues' && (
                <div className="space-y-8 animate-fadeIn">
                  {/* Scenario Selectors & Speed Controls */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-2xs space-y-4">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div className="space-y-1">
                        <span className="text-[11px] font-extrabold text-indigo-600 uppercase tracking-wider">選擇聽力情境 (10大場景)：</span>
                        <div className="flex flex-wrap gap-2 pt-1">
                          {DIALOGUES_DATA.map((d, idx) => (
                            <button
                              key={d.id}
                              onClick={() => {
                                setSelectedDialogueIndex(idx);
                                setActiveLineIdx(null);
                                setRecordedAudioUrl(null);
                                setRecognizedText('');
                                setSpeakingScore(null);
                              }}
                              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                                selectedDialogueIndex === idx
                                  ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs'
                                  : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                              }`}
                            >
                              {d.title}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Speed Switcher */}
                      <div className="flex items-center space-x-2 bg-slate-50 p-2 rounded-xl border border-slate-200 shrink-0">
                        <span className="text-xs font-bold text-slate-500 pl-1">播放語速：</span>
                        <button
                          onClick={() => setPlaybackRate(1.0)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${
                            playbackRate === 1.0 ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          標準 (1.0x)
                        </button>
                        <button
                          onClick={() => setPlaybackRate(0.7)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${
                            playbackRate === 0.7 ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          慢速 (0.7x)
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Main Dialogue Player & Shadowing Panel */}
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Dialogue Sentences List */}
                    <div className="lg:col-span-2 bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 space-y-6 shadow-xs">
                      <div className="border-b border-slate-100 pb-4 flex justify-between items-center">
                        <div>
                          <span className="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-extrabold rounded-full border border-indigo-200">
                            {currentDialogue.category} • {currentDialogue.difficulty}

                          <h2 className="text-xl font-extrabold text-slate-900 mt-2">
                            {currentDialogue.title}

                          <p className="text-xs text-slate-500 mt-1">{currentDialogue.description}</p>
                        </div>
                        <button
                          onClick={() => {
                            const fullText = currentDialogue.lines.map(l => l.text).join(' ');
                            speakSentence(fullText, playbackRate);
                          }}
                          className="flex items-center space-x-1.5 px-3 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700 transition-colors shadow-2xs shrink-0"
                        >
                          <Icon name="volume-2" className="w-4 h-4" />
                          <span>朗讀整段對話</span>
                        </button>
                      </div>

                      {/* Interactive Lines */}
                      <div className="space-y-4">
                        {currentDialogue.lines.map((line, idx) => {
                          const isActive = activeLineIdx === idx;
                          return (
                            <div
                              key={idx}
                              className={`p-4 rounded-2xl border transition-all ${
                                isActive
                                  ? 'bg-indigo-50/80 border-indigo-300 shadow-xs'

                              <div className="flex justify-between items-start gap-2">
                                <div className="space-y-1">
                                  <span className="text-xs font-black text-indigo-800 bg-indigo-100/80 px-2 py-0.5 rounded">
                                    {line.speaker}
                                  </span>
                                  <p className="text-base font-bold text-slate-900 pt-1 leading-snug">
                                    {line.text}
                                  </p>
                                  <p className="text-xs text-slate-600">{line.zh}</p>
                                </div>

                                <button
                                  onClick={() => {
                                    setActiveLineIdx(idx);
                                    speakSentence(line.text, playbackRate);
                                  }}
                                  className="p-2 bg-white text-indigo-600 rounded-xl border border-indigo-200 hover:bg-indigo-600 hover:text-white transition-colors shrink-0 shadow-2xs"
                                  title="單句朗讀"
                                >
                                  <Icon name="volume-2" className="w-4 h-4" />
                                </button>
                              </div>

                              {line.note && (
                                <div className="mt-3 pt-2 border-t border-slate-200/60 text-[11px] text-indigo-900 font-medium flex items-center space-x-1">
                                  <Icon name="info" className="w-3.5 h-3.5 text-indigo-600 shrink-0" />
                                  <span>聽力解析：{line.note}</span>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Shadowing Practice Side Panel with AI Scoring */}
                    <div className="space-y-6">
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-5 shadow-xs">
                        <div className="border-b border-slate-100 pb-3">
                          <h3 className="font-extrabold text-slate-900 text-sm flex items-center space-x-1.5">
                            <Icon name="mic" className="w-4 h-4 text-indigo-600" />
                            <span>AI 口說跟讀評分</span>
                          </h3>
                          <p className="text-xs text-slate-500 mt-1">
                            點擊麥克風親口朗讀，系統將自動將您的語音轉為文字並計算發音精準度！
                          </p>
                        </div>

                        {activeLineIdx !== null ? (
                          <div className="p-4 bg-indigo-50/70 rounded-xl border border-indigo-100 text-xs space-y-2">
                            <span className="font-bold text-indigo-900 block">當前練習句子：</span>
                            <p className="font-bold text-slate-900 text-sm">
                              "{currentDialogue.lines[activeLineIdx].text}"
                            </p>
                          </div>
                        ) : (
                          <p className="text-xs text-slate-400 italic">
                            💡 請點擊左側對話中的喇叭按鈕選擇欲練習的句子。
                          </p>
                        )}

                        <div className="flex flex-col items-center justify-center py-4 space-y-3 bg-slate-50 rounded-2xl border border-slate-200">
                          <button
                            onClick={() => toggleRecording(activeLineIdx !== null ? currentDialogue.lines[activeLineIdx].text : '')}
                            className={`w-14 h-14 rounded-full flex items-center justify-center text-white transition-all shadow-md ${
                              isRecording ? 'bg-rose-500 animate-recording scale-105' : 'bg-indigo-600 hover:bg-indigo-700'
                            }`}
                          >
                            <Icon name={isRecording ? 'square' : 'mic'} className="w-6 h-6" />
                          </button>
                          <span className="text-xs font-bold text-slate-600">
                            {isRecording ? '語音辨識中... 再次點擊結束' : '點擊開始錄音跟讀'}
                          </span>
                        </div>

                        {/* Recognition Result & Score */}
                        {recognizedText && (
                          <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2">
                            <span className="font-bold text-slate-700 block">AI 語音辨識結果：</span>
                            <p className="text-slate-900 font-mono bg-white p-2 rounded border border-slate-100">
                              "{recognizedText}"
                            </p>

                            {speakingScore !== null && (
                              <div className="pt-2 flex justify-between items-center border-t border-slate-200">
                                <span className="font-bold text-slate-700">口說精準度：</span>
                                <span className={`font-black text-sm px-2.5 py-0.5 rounded-full ${
                                  speakingScore >= 80 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                }`}>
                                  {speakingScore}% {speakingScore >= 80 ? '🌟 完美發音' : '👍 良好嘗試'}
                                </span>
                              </div>
                            )}
                          </div>
                        )}

                        {recordedAudioUrl && (
                          <div className="space-y-2 pt-2 border-t border-slate-100">
                            <span className="text-xs font-bold text-slate-700 block">錄音成果播放：</span>
                            <audio controls src={recordedAudioUrl} className="w-full h-8" />
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'speaking' && (
                <div className="space-y-8 animate-fadeIn">
                  <div className="text-center max-w-2xl mx-auto space-y-2">
                    <span className="px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-extrabold rounded-full">
                      口說大師講堂
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">口說萬用句型特訓</h2>
                    <p className="text-slate-600 text-xs sm:text-sm">
                      掌握高頻萬用句型模板，擺脫中式英語，表達更地道自然！
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {SPEAKING_PHRASES.map((item, idx) => (
                      <div key={idx} className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 shadow-xs">
                        <div className="flex justify-between items-center">
                          <span className="px-2.5 py-0.5 bg-indigo-50 text-indigo-700 text-xs font-extrabold rounded-full border border-indigo-200">
                            {item.category}
                          </span>
                          <button
                            onClick={() => speakSentence(item.example)}
                            className="p-1.5 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-600 hover:text-white transition-colors"
                          >
                            <Icon name="volume-2" className="w-4 h-4" />
                          </button>
                        </div>

                        <div>
                          <h3 className="text-lg font-extrabold text-slate-900">{item.phrase}</h3>
                          <p className="text-xs text-slate-500 mt-0.5">{item.zh}</p>
                        </div>

                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs space-y-1">
                          <span className="font-bold text-indigo-900 block">實用例句示範：</span>
                          <p className="font-bold text-slate-900">"{item.example}"</p>
                          <p className="text-slate-500">{item.exampleZh}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'rules' && (
                <div className="space-y-8 animate-fadeIn">
                  <div className="text-center max-w-2xl mx-auto space-y-2">
                    <span className="px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-extrabold rounded-full">
                      聽力突破密碼
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">連音與發音變音規律</h2>
                    <p className="text-slate-600 text-xs sm:text-sm">
                      掌握口語連音、閃音與弱化，聽懂老外講話時的自然省音音調變化。
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {SPEECH_RULES.map((rule, idx) => (
                      <div key={idx} className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 shadow-xs flex flex-col justify-between">
                        <div className="space-y-3">
                          <h3 className="text-lg font-extrabold text-slate-900">{rule.title}</h3>
                          <p className="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                            {rule.concept}
                          </p>
                          <div className="text-xs font-bold text-indigo-900 bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                            範例對比：<br />
                            <span className="font-mono text-indigo-700">{rule.example}</span>
                          </div>
                        </div>

                        <div className="pt-4 border-t border-slate-100 space-y-2">
                          <div className="flex justify-between items-center text-xs">
                            <span className="font-bold text-slate-700">朗讀句子：</span>

                              onClick={() => speakSentence(rule.sentence, 0.9)}
                              className="text-indigo-600 hover:text-indigo-800 font-bold flex items-center space-x-1"
                            >
                              <Icon name="volume-2" className="w-4 h-4" />
                              <span>試聽語音</span>
                            </button>
                          </div>
                          <p className="text-sm font-bold text-slate-900">"{rule.sentence}"</p>
                          <span className="text-[11px] font-mono text-slate-400 block">{rule.phoneticHint}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'dictation' && (
                <div className="max-w-2xl mx-auto space-y-6 animate-fadeIn">

                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">聽音聽寫填空測驗 (10 題精選)</h2>

                  <div className="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 space-y-6 shadow-xs">
